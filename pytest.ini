[pytest]
# Keep discovery explicit: without this, pytest walks the repo root and can
# pick up scripts/ (verify_ui_live.py drives a LIVE stack and must never run
# as a unit test) or a stale .venv/.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra surfaces the reason for every skip, so an ML extra silently missing in
# CI shows up as a visible "9 skipped" line instead of passing unnoticed.
addopts = -ra --strict-markers --strict-config

markers =
    slow: long-running tests (model training, large corpora)
    ml: requires optional ML extras (scikit-learn / spaCy)

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
