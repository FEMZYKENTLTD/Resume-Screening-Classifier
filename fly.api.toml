app = "resume-api-femi"
primary_region = "jnb"   # Johannesburg — nearest Fly region to Lagos

# Secrets are set ONCE with flyctl (never committed here):
#   fly secrets set DATABASE_URL="postgresql://..." REDIS_URL="rediss://..." \
#     AUTH_SECRET_KEY="..." ADMIN_USERNAMES="admin,femi" --app resume-api-femi

[build]
  dockerfile = "Dockerfile.api"

[deploy]
  release_command = "alembic upgrade head"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # spaCy NER + sklearn classifier will OOM the 256MB default

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = "off"    # always-on while demoing; `fly scale count 0` pauses billing
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "120s"       # ML imports are slow on first boot — don't kill it early
    method = "GET"
    # LIVENESS only, and intentionally so: a failing http_check makes Fly
    # restart/depool the machine. If this probed the database, a brief
    # Supabase blip would restart-loop the API and turn a 30s storage hiccup
    # into a full outage.
    #
    # /health/ready DOES check the database and answers 503 when it is
    # unusable. Point an EXTERNAL uptime monitor (Better Stack, UptimeRobot,
    # Fly's own alerting) at https://resume-api-femi.fly.dev/health/ready --
    # during the jobstatus incident /health answered "ok" every 15 seconds
    # while every write failed, so nothing ever alerted.
    path = "/health"
