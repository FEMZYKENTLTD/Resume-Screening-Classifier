app = "resume-worker-femi"
primary_region = "jnb"

# Secrets (same values as the API app):
#   fly secrets set DATABASE_URL="postgresql://..." REDIS_URL="rediss://..." --app resume-worker-femi

[build]
  dockerfile = "Dockerfile.worker"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"   # spaCy NER + sklearn classifier need more than the 256MB default
