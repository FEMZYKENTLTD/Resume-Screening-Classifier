global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: resume-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: resume-worker
    static_configs:
      # worker exposes metrics when WORKER_METRICS_PORT is set (see compose)
      - targets: ["worker:9101"]
        labels:
          service: worker
