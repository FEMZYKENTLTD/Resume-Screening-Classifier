$y = @'
name: Verify & Deploy Full Stack

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile check
        run: python -m compileall -q .
      - name: Smoke tests (API + worker + scoring, SQLite-backed)
        run: pytest -q
      - name: Migration sanity (single head, applies cleanly)
        env:
          DATABASE_URL: sqlite:////tmp/ci_migrations.db
        run: |
          test "$(alembic heads | grep -c head)" -eq 1
          alembic upgrade head

  deploy-api:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Sync secrets from GitHub into the Fly app
        run: |
          flyctl secrets set \
            DATABASE_URL="$DATABASE_URL" \
            REDIS_URL="$REDIS_URL" \
            AUTH_SECRET_KEY="$AUTH_SECRET_KEY" \
            ADMIN_USERNAMES="admin,femi" \
            --app resume-api-femi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
      - name: Deploy API
        run: flyctl deploy --remote-only --config fly.api.toml --app resume-api-femi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-worker:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Sync secrets from GitHub into the Fly app
        run: |
          flyctl secrets set \
            DATABASE_URL="$DATABASE_URL" \
            REDIS_URL="$REDIS_URL" \
            --app resume-worker-femi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
      - name: Deploy Worker
        run: flyctl deploy --remote-only --config fly.worker.toml --app resume-worker-femi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-streamlit:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render Deploy
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          https://api.render.com/v1/services/${{ secrets.RENDER_STREAMLIT_ID }}/deploys
'@
[IO.File]::WriteAllText((Join-Path (Get-Location) ".github\workflows\deploy.yml"), $y, (New-Object System.Text.UTF8Encoding($false)))